<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1628">
<title>Daycation Bologna</title>
<meta name="description" content="Gite in giornata in aereo da Bologna, con orari ufficiali dell'aeroporto Marconi.">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#F5F7FB;color:#0A1628;min-height:100vh;-webkit-font-smoothing:antialiased;line-height:1.4}
button,input,select{font-family:inherit;color:inherit}
a{text-decoration:none;color:inherit}
::-webkit-scrollbar{display:none}
.muted{color:#6B7785}
.tiny{font-size:11px}
.small{font-size:12px}
.b{font-weight:700}.b8{font-weight:800}

/* Header */
header{background:#0A1628;padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 1px 0 rgba(0,0,0,.04)}
.logo{width:34px;height:34px;background:#F5A623;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px}
.h-title{font-size:16px;font-weight:800;color:#fff;letter-spacing:-.3px;line-height:1.2}
.h-sub{font-size:10.5px;color:rgba(255,255,255,.5);margin-top:1px}

/* Form area */
.form-area{background:linear-gradient(165deg,#0A1628 0%,#152A4A 100%);padding:18px 16px 24px}
.form-card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 12px 32px rgba(10,22,40,.16)}
.lbl{font-size:10px;font-weight:700;color:#6B7785;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
input[type=date],select{width:100%;height:46px;border:1.5px solid #E1E6EE;border-radius:11px;padding:0 12px;font-size:15px;font-weight:600;color:#0A1628;outline:none;background:#fff;-webkit-appearance:none;appearance:none}
input[type=date]:focus,select:focus{border-color:#0A1628}
.chip-row{display:flex;gap:6px}
.chip{flex:1;height:42px;border:1.5px solid #E1E6EE;background:#fff;color:#94A3B8;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;transition:all .12s}
.chip.on{border-color:#0A1628;background:#0A1628;color:#fff}

/* Sort bar */
.sort-bar{display:flex;gap:7px;padding-bottom:2px;margin-bottom:14px;overflow-x:auto}
.sort-pill{flex-shrink:0;padding:8px 14px;border-radius:50px;border:1.5px solid #E1E6EE;background:#fff;color:#6B7785;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .12s}
.sort-pill.on{border-color:#0A1628;background:#0A1628;color:#fff}

/* Cards */
.card{background:#fff;border-radius:18px;margin-bottom:12px;overflow:hidden;border:1px solid #EAEEF5;transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 20px rgba(10,22,40,.08)}
.c-head{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.c-title{font-size:19px;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.c-desc{font-size:11.5px;color:#6B7785;margin-top:3px}
.c-hours{text-align:right;flex-shrink:0}
.c-hours-big{font-size:22px;font-weight:800;color:#0A1628;letter-spacing:-.5px;line-height:1}
.c-hours-lbl{font-size:10px;color:#6B7785;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

.c-airline{margin:0 16px 10px;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:6px;font-size:11px;font-weight:700}
.al-dot{width:8px;height:8px;border-radius:50%}

.c-flights{margin:0 16px 12px;background:#F5F7FB;border-radius:12px;padding:11px 13px}
.flt{display:flex;align-items:center;gap:10px}
.flt+.flt{margin-top:8px;padding-top:8px;border-top:1px solid #E1E6EE}
.flt-icon{font-size:13px;width:18px;flex-shrink:0}
.flt-time{font-size:15px;font-weight:800;color:#0A1628;letter-spacing:-.2px}
.flt-route{flex:1;font-size:11px;color:#6B7785}

.c-foot{padding:11px 16px;border-top:1px solid #EAEEF5;display:flex;align-items:center;justify-content:space-between;gap:8px}
.foot-info{font-size:11px;color:#6B7785}
.btn-sky{background:#0E4EAD;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px;box-shadow:0 3px 10px rgba(14,78,173,.25);transition:transform .1s}
.btn-sky:active{transform:scale(.97)}

/* Empty / error states */
.state{text-align:center;padding:48px 24px}
.state-icon{font-size:42px;margin-bottom:14px;opacity:.7}
.state-title{font-size:18px;font-weight:800;margin-bottom:8px}
.state-msg{font-size:13px;color:#6B7785;line-height:1.6;max-width:300px;margin:0 auto}

/* Loading */
.loading{padding:60px 20px;text-align:center;color:#6B7785;font-size:13px}
.spin{display:inline-block;width:22px;height:22px;border:2.5px solid #E1E6EE;border-top-color:#F5A623;border-radius:50%;animation:s 1s linear infinite;margin-bottom:10px}
@keyframes s{to{transform:rotate(360deg)}}

/* Result header */
.result-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.result-count{font-size:18px;font-weight:800;letter-spacing:-.3px}
.result-day{font-size:11px;font-weight:700;color:#6B7785;background:#EAEEF5;padding:4px 11px;border-radius:50px}

/* Footer */
footer{padding:24px 16px 32px;text-align:center;color:#9AA5B5;font-size:10.5px;line-height:1.6}
footer a{color:#6B7785;text-decoration:underline;text-decoration-color:#D1D7E2;text-underline-offset:2px}
.sig{margin-top:8px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#B8C0CC}

main{padding:18px 14px 0;max-width:600px;margin:0 auto}
</style>
</head>
<body>

<header>
  <div class="logo">✈</div>
  <div style="flex:1;min-width:0">
    <div class="h-title">Daycation Bologna</div>
    <div class="h-sub" id="metaInfo">Voli diretti dall'aeroporto Marconi</div>
  </div>
</header>

<div class="form-area">
  <div class="form-card">
    <div class="lbl">Quando vuoi partire?</div>
    <input type="date" id="dateInput">
    <div class="tiny muted" id="dateLabel" style="margin-top:4px"></div>

    <div style="display:flex;gap:10px;margin-top:14px">
      <div style="flex:1">
        <div class="lbl">Persone</div>
        <select id="paxInput">
          <option value="1">1</option><option value="2" selected>2</option>
          <option value="3">3</option><option value="4">4</option>
        </select>
      </div>
      <div style="flex:2.2">
        <div class="lbl">Almeno quante ore lì?</div>
        <div class="chip-row" id="hoursFilter">
          <button class="chip" data-h="3">3h</button>
          <button class="chip on" data-h="5">5h</button>
          <button class="chip" data-h="7">7h</button>
          <button class="chip" data-h="9">9h</button>
        </div>
      </div>
    </div>
  </div>
</div>

<main>
  <div id="content">
    <div class="loading">
      <div class="spin"></div>
      <div>Carico orari ufficiali BLQ…</div>
    </div>
  </div>
</main>

<footer>
  <div>Dati: <a href="https://www.bologna-airport.it" target="_blank" rel="noopener">Aeroporto G. Marconi Bologna</a> · prezzi reali su Skyscanner</div>
  <div class="sig">AV · 2026</div>
</footer>

<script>
// ─── DATA & STATE ───
let DATA = null;

// ─── UTILS ───
const t2m = t => parseInt(t)*60 + parseInt(t.slice(3));
const m2t = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
const freqOk = (bm, wd) => (bm >> (wd-1)) & 1;
const inVal = (iso, vals) => { const md = iso.slice(5,7)+iso.slice(8,10); return vals.some(([f,t]) => f<=md && md<=t); };

const fmtDate = iso => { if(!iso)return''; const d=new Date(iso); return `${DAYS[d.getDay()]} ${parseInt(iso.slice(8))} ${MONTHS[parseInt(iso.slice(5,7))-1]}`; };

function airline(fno){

function cityInfo(c){ return CITY_INFO[c] || {iata:'',flag:'🌍',desc:''}; }

function skyLink(iata, date, pax){
  const d = date.replace(/-/g,'').slice(2);
  return `https://www.skyscanner.it/trasporti/voli/blq/${iata.toLowerCase()}/${d}/${d}?adults=${pax}&locale=it-IT&currency=EUR&stops=0`;
}

// ─── ENGINE ───
function findDaycations(dateIso, minHours){
  const dt = new Date(dateIso);
  const wd = dt.getDay() === 0 ? 7 : dt.getDay();
  const md = dateIso.slice(5,7) + dateIso.slice(8,10);

  // Verifica range di validità del dataset
  // (i voli hanno validità in formato MMDD; il dataset copre la stagione)
  const cities = [...new Set(DATA.d.map(v => v[0]))];
  const results = [];

  for (const city of cities) {
    const outF = DATA.d.filter(v => v[0]===city && freqOk(v[4],wd) && inVal(dateIso,v[5]));
    const retF = DATA.a.filter(v => v[0]===city && freqOk(v[4],wd) && inVal(dateIso,v[5]));
    if (!outF.length || !retF.length) continue;

    let best = null;
    for (const o of outF) for (const r of retF) {
      const arrC = t2m(o[3]);   // arrivo a destinazione
      const depC = t2m(r[2]);   // partenza dalla destinazione
      const orePosto = (depC - arrC) / 60;
      if (orePosto < 3) continue;
      const arrHome = t2m(r[3]);
      const depHome = t2m(o[2]);
      const oreFuori = (arrHome - depHome) / 60;
      if (!best || orePosto > best.orePosto) {
        best = { out: o, ret: r, orePosto, oreFuori };
      }
    }
    if (best && best.orePosto >= minHours) {
      results.push({ city, ...best });
    }
  }
  return results;
}

// ─── RENDER ───
function cardHTML(r){
  const ci = cityInfo(r.city);
  const sky = skyLink(ci.iata, STATE.date, STATE.pax);
  const alOut = airline(r.out[1]);
  const alRet = airline(r.ret[1]);
  const sameAl = alOut.n === alRet.n;
  const flightDurO = Math.round((t2m(r.out[3]) - t2m(r.out[2])) / 6) / 10;
  const flightDurR = Math.round((t2m(r.ret[3]) - t2m(r.ret[2])) / 6) / 10;

  return `
<div class="card">
  <div class="c-head">
    <div style="flex:1;min-width:0">
      <div class="c-title">${ci.flag} ${r.city}</div>
      <div class="c-desc">${ci.iata ? ci.iata + ' · ' : ''}${ci.desc}</div>
    </div>
    <div class="c-hours">
      <div class="c-hours-big">${r.orePosto.toFixed(1)}h</div>
      <div class="c-hours-lbl">Sul posto</div>
    </div>
  </div>

  <div class="c-airline" style="background:${alOut.c}14;color:${alOut.c}">
    <span class="al-dot" style="background:${alOut.c}"></span>
    ${alOut.n}${!sameAl ? ' / ' + alRet.n : ''}
  </div>

  <div class="c-flights">
    <div class="flt">
      <span class="flt-icon">🛫</span>
      <span class="flt-time">${r.out[2]} → ${r.out[3]}</span>
      <span class="flt-route">BLQ → ${ci.iata} · ${flightDurO}h</span>
    </div>
    <div class="flt">
      <span class="flt-icon">🛬</span>
      <span class="flt-time">${r.ret[2]} → ${r.ret[3]}</span>
      <span class="flt-route">${ci.iata} → BLQ · ${flightDurR}h</span>
    </div>
  </div>

  <div class="c-foot">
    <div class="foot-info">Giro totale: <strong>${r.oreFuori.toFixed(1)}h</strong></div>
    <a class="btn-sky" href="${sky}" target="_blank" rel="noopener">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
      Cerca prezzi
    </a>
  </div>
</div>`;
}

function render(){
  const root = document.getElementById('content');
  if (!DATA) return;

  // Verifica che la data sia dentro la stagione attualmente nel dataset
  // (uso la validità dei voli stessi come bound)
  const allDates = DATA.d.flatMap(v => v[5]).flat();
  const validRange = allDates.length ? { min: allDates.reduce((a,b)=>a<b?a:b), max: allDates.reduce((a,b)=>a>b?a:b) } : null;
  const md = STATE.date.slice(5,7) + STATE.date.slice(8,10);

  if (validRange && (md < validRange.min || md > validRange.max)) {
    root.innerHTML = `
      <div class="state">
        <div class="state-icon">🗓</div>
        <div class="state-title">Data fuori stagione</div>
        <div class="state-msg">Il dataset attuale (<strong>${DATA.meta.season.replace('_',' ')}</strong>) copre da ${validRange.min.slice(2)}/${validRange.min.slice(0,2)} a ${validRange.max.slice(2)}/${validRange.max.slice(0,2)}. Scegli una data in quel periodo.</div>
      </div>`;
    return;
  }

  const results = findDaycations(STATE.date, STATE.minH);

  if (!results.length) {
    root.innerHTML = `
      <div class="state">
        <div class="state-icon">🌥</div>
        <div class="state-title">Nessuna daycation possibile</div>
        <div class="state-msg">${DAYS[new Date(STATE.date).getDay()]}: nessun volo diretto da BLQ permette almeno ${STATE.minH}h sul posto. Prova un'altra data o riduci le ore minime.</div>
      </div>`;
    return;
  }

  // Sort
  if (STATE.sort === 'ore') results.sort((a,b) => b.orePosto - a.orePosto);
  else if (STATE.sort === 'partenza') results.sort((a,b) => a.out[2].localeCompare(b.out[2]));
  else if (STATE.sort === 'rientro') results.sort((a,b) => a.ret[3].localeCompare(b.ret[3]));

  root.innerHTML = `
    <div class="result-head">
      <div class="result-count">${results.length} gite possibili</div>
      <div class="result-day">${DAYS[new Date(STATE.date).getDay()]}</div>
    </div>
    <div class="sort-bar">
      <button class="sort-pill ${STATE.sort==='ore'?'on':''}" data-s="ore">⏱ Più tempo</button>
      <button class="sort-pill ${STATE.sort==='partenza'?'on':''}" data-s="partenza">🌅 Parte prima</button>
      <button class="sort-pill ${STATE.sort==='rientro'?'on':''}" data-s="rientro">🌙 Rientra prima</button>
    </div>
    ${results.map(cardHTML).join('')}
    <div style="margin-top:14px;padding:14px 16px;background:#fff;border-radius:14px;border:1px solid #EAEEF5;font-size:11.5px;color:#6B7785;line-height:1.6">
      <strong style="color:#0A1628">Come funziona</strong><br>
      Mostro solo voli <strong>diretti</strong> andata+ritorno nello stesso giorno secondo l'orario ufficiale BLQ. Per ogni città scelgo automaticamente la combinazione che lascia più tempo sul posto. I prezzi reali del giorno si vedono cliccando su <strong>Cerca prezzi</strong>.
    </div>
  `;

  // Re-bind sort buttons
  root.querySelectorAll('.sort-pill').forEach(btn => {
    btn.addEventListener('click', () => { STATE.sort = btn.dataset.s; render(); });
  });
}

// ─── INIT ───
async function init(){
  // Default date
  STATE.date = todayPlus(7);
  const di = document.getElementById('dateInput');
  di.value = STATE.date;
  document.getElementById('dateLabel').textContent = fmtDate(STATE.date);

  di.addEventListener('change', e => {
    STATE.date = e.target.value;
    document.getElementById('dateLabel').textContent = fmtDate(STATE.date);
    render();
  });
  document.getElementById('paxInput').addEventListener('change', e => {
    STATE.pax = parseInt(e.target.value);
    render();
  });
  document.querySelectorAll('#hoursFilter .chip').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('#hoursFilter .chip').forEach(c => c.classList.remove('on'));
      b.classList.add('on');
      STATE.minH = parseInt(b.dataset.h);
      render();
    });
  });

  // Fetch dataset
  try {
    const resp = await fetch('data.json', { cache: 'no-cache' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    DATA = await resp.json();
    document.getElementById('metaInfo').textContent = `${DATA.meta.cities.length} destinazioni · ${DATA.meta.season.replace('_', ' ')}`;
    render();
  } catch(e) {
    document.getElementById('content').innerHTML = `
      <div class="state">
        <div class="state-icon">⚠️</div>
        <div class="state-title">Errore di caricamento</div>
        <div class="state-msg">Non riesco a caricare gli orari aggiornati. Riprova tra qualche istante.<br><br><span class="tiny muted">${e.message}</span></div>
      </div>`;
  }
}

init();
</script>
</body>
</html>
