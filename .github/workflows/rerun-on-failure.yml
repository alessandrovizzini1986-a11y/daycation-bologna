name: Rerun flight data on failure

# Se "Update BLQ flight data" fallisce (tipicamente un intoppo di rete/runner
# che GitHub cancella dopo ~15 min), lo rilancia UNA volta in automatico.
# Guard su run_attempt == 1 -> nessun loop.

on:
  workflow_run:
    workflows: ["Update BLQ flight data"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - name: Rerun failed jobs once
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run rerun ${{ github.event.workflow_run.id }} --failed --repo ${{ github.repository }}
