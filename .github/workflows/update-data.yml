name: Update BLQ flight data

on:
  schedule:
    # Orari UTC (GitHub non gestisce l'ora legale): commenti in ora italiana estiva.
    - cron: '0 4 * * *'    # notte (esistente)
    - cron: '0 3 * * *'    # ~05:00 mattina
    - cron: '0 14 * * *'   # ~16:00 pomeriggio
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12          # il job non resta mai appeso: fallisce pulito e il giro dopo recupera
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run parser
        run: python3 parse_blq.py

      - name: Fetch prices (optional, fail-soft)
        continue-on-error: true
        timeout-minutes: 6       # se l'API prezzi è lenta, non trascina l'intero job (i prezzi sono opzionali)
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
        run: python3 fetch_prices.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json weekend-data.json
          if git diff --staged --quiet; then
            echo "Nessun cambiamento"
          else
            git commit -m "🔄 Update BLQ flight data ($(date -u +%Y-%m-%d))"
            git push
          fi